<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="resto-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Accent Flare Gradient -->
    <linearGradient id="resto-spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Ribbon Highlight Gradient -->
    <linearGradient id="resto-loop-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <!-- Drop Shadow Filter for Depth -->
    <filter id="resto-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#312E81" flood-opacity="0.35" />
    </filter>

    <filter id="resto-inner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle with Subtle Rim Highlight -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#resto-bg-grad)" filter="url(#resto-shadow)" />
  <rect x="8.75" y="8.75" width="110.5" height="110.5" rx="27.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5" />

  <!-- Abstracted POS "P" + Cloche / Dining Arch Symbol -->
  <g filter="url(#resto-inner-glow)">
    <!-- Vertical Pillar / Terminal Stem -->
    <rect x="36" y="32" width="15" height="64" rx="7.5" fill="url(#resto-loop-grad)" />

    <!-- Cloche Loop of the "P" -->
    <path
      d="M48 32 C 76 32, 92 46, 92 62 C 92 78, 76 90, 48 90 L 48 76 C 66 76, 77 68, 77 62 C 77 54, 66 46, 48 46 Z"
      fill="url(#resto-loop-grad)"
      fill-rule="evenodd"
    />

    <!-- Dining Spark / Order Bell Handle in Warm Amber -->
    <circle cx="82" cy="40" r="7" fill="url(#resto-spark-grad)" />

    <!-- Terminal Receipt Flow Line in Base of Loop -->
    <rect x="56" y="58" width="16" height="4" rx="2" fill="#6366F1" fill-opacity="0.8" />
  </g>
</svg>

