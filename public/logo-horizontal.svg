<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56">
  <defs>
    <linearGradient id="lh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="lh-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Emblem Mark (44x44) -->
  <g transform="translate(6, 6)">
    <rect width="44" height="44" rx="12" fill="url(#lh-bg)" />
    <rect x="0.5" y="0.5" width="43" height="43" rx="11.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" />
    <rect x="12" y="10" width="5.5" height="24" rx="2.75" fill="#FFFFFF" />
    <path d="M17 10 C 27 10, 32 14.5, 32 20.5 C 32 26.5, 27 30, 17 30 L 17 24 C 23 24, 26 22, 26 20.5 C 26 18, 23 16, 17 16 Z" fill="#FFFFFF" />
    <circle cx="28.5" cy="13" r="2.8" fill="url(#lh-spark)" />
  </g>

  <!-- Wordmark Typography -->
  <g transform="translate(62, 0)">
    <!-- Brand Title -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="21" font-weight="800" letter-spacing="-0.5px" fill="currentColor">
      Resto<tspan fill="#6366F1">POS</tspan>
    </text>
    <!-- Tagline Subtitle -->
    <text x="1" y="46" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="1.2px" fill="currentColor" opacity="0.6">
      SISTEM KASIR KAFE &amp; RESTO
    </text>
  </g>
</svg>
